{% if messages %}
<div class="container" style="margin-top: 1rem;">
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %}">
      <span>{{ message }}</span>
      <button type="button" class="alert-close-btn" style="background:none;border:none;cursor:pointer;font-size:1.1rem;color:inherit;" aria-label="Close">&times;</button>
    </div>
  {% endfor %}
</div>
{% endif %}
